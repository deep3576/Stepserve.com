[project]
name = "stepserve"
version = "0.1.0"
description = "Stepserve marketplace backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.31.0,<1.0.0",
  "gunicorn>=22.0.0,<23.0.0",
  "a2wsgi>=1.10.7,<2.0.0",
  "pydantic-settings>=2.5.2,<3.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "pymysql>=1.1.1,<2.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "python-jose[cryptography]>=3.3.0,<4.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "stripe>=11.1.0,<12.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3,<9.0.0",
  "httpx>=0.27.2,<1.0.0",
  "ruff>=0.6.9,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
