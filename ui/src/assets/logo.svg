<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" fill="none">
  <!-- Icon: ascending staircase (left=short, right=tall) with checkmark -->
  <!-- Bar 1 (shortest) -->
  <rect x="2" y="28" width="10" height="14" rx="2.5" fill="#0a7c5c"/>
  <!-- Bar 2 -->
  <rect x="15" y="20" width="10" height="22" rx="2.5" fill="#0a7c5c"/>
  <!-- Bar 3 -->
  <rect x="28" y="12" width="10" height="30" rx="2.5" fill="#0a7c5c"/>
  <!-- Bar 4 (tallest) -->
  <rect x="41" y="4" width="10" height="38" rx="2.5" fill="#0a7c5c"/>
  <!-- Checkmark on top of bar 4 -->
  <circle cx="46" cy="8" r="7" fill="white" opacity="0.2"/>
  <polyline points="42.5,8 45.5,11 50,5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark -->
  <text x="62" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="-0.8" fill="#0a7c5c">Step</text>
  <text x="111" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="-0.8" fill="#1a1a1a">Serve</text>
</svg>
